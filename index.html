        <script>
            // Rolling-letter reveal: [data-roll] links roll their text into the
            // data-roll value on hover. Desktop: first click locks, second click
            // follows the link. Touch: tap follows the link straight away.
            const canHover = window.matchMedia("(hover: hover) and (pointer: fine)");

            function buildRow(text, cls) {
                const row = document.createElement("span");
                row.className = "roll-row " + cls;
                const chars = [...text];
                chars.forEach((c, i) => {
                    const span = document.createElement("span");
                    span.className = "roll-char";
                    span.textContent = c;
                    span.style.setProperty("--i", i);
                    span.style.setProperty("--n", Math.max(chars.length - 1, 1));
                    row.appendChild(span);
                });
                return row;
            }

            function initRolls() {
                document.querySelectorAll("[data-roll]:not([data-roll-ready])").forEach((el) => {
                    const from = el.textContent.trim();
                    const to = el.dataset.roll;
                    el.dataset.rollReady = "";
                    el.setAttribute("aria-label", `${from}: ${to}`);

                    const roll = document.createElement("span");
                    roll.className = "roll";
                    roll.setAttribute("aria-hidden", "true");
                    roll.append(buildRow(from, "roll-from"), buildRow(to, "roll-to"));
                    el.replaceChildren(roll);

                    el.addEventListener("click", (e) => {
                        if (!canHover.matches || el.classList.contains("is-revealed")) return;
                        e.preventDefault();
                        el.classList.add("is-revealed");
                    });
                });
            }

            document.addEventListener("DOMContentLoaded", () => {
                initRolls();
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                entry.target.style.animationPlayState =
                                    "running";
                            }
                        });
                    },
                    { threshold: 0.1 },
                );

                const observeElements = () => {
                    document.querySelectorAll(".animate").forEach((el) => {
                        if (el.style.animationPlayState !== "running") {
                            el.style.animationPlayState = "paused";
                            observer.observe(el);
                        }
                    });
                };

                observeElements();

                // Re-observe when htmx adds content
                document.body.addEventListener("htmx:afterSwap", (evt) => {
                    observeElements();
                    shuffleGalleries();
                    initRolls();
                });

                function shuffleGalleries() {
                    const tracks = document.querySelectorAll(".gallery-track");
                    tracks.forEach((track) => {
                        const images = Array.from(track.children);
                        for (let i = images.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            track.appendChild(images[j]);
                        }
                    });

                    document
                        .querySelectorAll(".services-item")
                        .forEach((item) => {
                            const track = item.querySelector(".gallery-track");
                            if (!track) return;

                            // Improved horizontal wheel scroll (natural vertical)
                            // Removed wheel listener to allow natural page scroll

                            // Drag to scroll
                            let isDown = false;
                            let startX;
                            let scrollLeft;
                            let isDragging = false;

                            track.addEventListener("mousedown", (e) => {
                                isDown = true;
                                isDragging = false;
                                track.classList.add("grabbing");
                                startX = e.pageX - track.offsetLeft;
                                scrollLeft = track.scrollLeft;
                            });

                            const endDrag = () => {
                                isDown = false;
                                track.classList.remove("grabbing");
                            };
                            track.addEventListener("mouseleave", endDrag);
                            track.addEventListener("mouseup", endDrag);

                            track.addEventListener("mousemove", (e) => {
                                if (!isDown) return;
                                const x = e.pageX - track.offsetLeft;
                                const walk = (x - startX) * 2;
                                if (Math.abs(walk) > 5) {
                                    isDragging = true;
                                    e.preventDefault();
                                    track.scrollLeft = scrollLeft - walk;
                                }
                            });
                            // Clean accordion toggle
                            item.onclick = function (e) {
                                if (isDragging) return;
                                
                                // Ignore clicks on nav buttons
                                if (e.target.closest(".nav-btn")) return;

                                if (
                                    e.target.closest(".gallery-track") &&
                                    item.classList.contains("active")
                                )
                                    return;

                                const isActive =
                                    item.classList.contains("active");

                                document
                                    .querySelectorAll(".services-item")
                                    .forEach((el) => {
                                        el.classList.remove("active");
                                    });

                                if (!isActive) {
                                    item.classList.add("active");
                                    setTimeout(() => {
                                        track.scrollLeft = 0;
                                    }, 50);
                                }
                            };

                            // Add Navigation Button Listeners
                            const prevBtn = item.querySelector('.prev-btn');
                            const nextBtn = item.querySelector('.next-btn');

                            function smoothScrollTo(element, amount, duration) {
                                const start = element.scrollLeft;
                                const startTime = performance.now();
                                
                                // Disable native snap and smooth behavior so JS can animate freely
                                const originalSnap = element.style.scrollSnapType || '';
                                const originalBehavior = element.style.scrollBehavior || '';
                                element.style.scrollSnapType = 'none';
                                element.style.scrollBehavior = 'auto';

                                // Apple-like ease-out curve
                                function easeOutCubic(t) {
                                    return 1 - Math.pow(1 - t, 3);
                                }

                                function animate(currentTime) {
                                    const elapsed = currentTime - startTime;
                                    const progress = Math.min(elapsed / duration, 1);
                                    
                                    element.scrollLeft = start + amount * easeOutCubic(progress);
                                    
                                    if (progress < 1) {
                                        requestAnimationFrame(animate);
                                    } else {
                                        element.style.scrollSnapType = originalSnap;
                                        element.style.scrollBehavior = originalBehavior;
                                    }
                                }
                                requestAnimationFrame(animate);
                            }
                            
                            if (prevBtn && nextBtn) {
                                prevBtn.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    const imageWidth = track.querySelector('.gallery-image-wrapper').offsetWidth;
                                    const gap = parseInt(window.getComputedStyle(track).gap) || 40;
                                    smoothScrollTo(track, -(imageWidth + gap), 800);
                                });

                                nextBtn.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    const imageWidth = track.querySelector('.gallery-image-wrapper').offsetWidth;
                                    const gap = parseInt(window.getComputedStyle(track).gap) || 40;
                                    smoothScrollTo(track, (imageWidth + gap), 800);
                                });
                            }

                        });
                }

                shuffleGalleries();
            });
        </script>
